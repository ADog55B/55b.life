  .social a,

    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);

  .social a:hover,
  .mail a:hover {
    color: var(--accent);

  .sep {

  .mail { margin-top: 8px; }

  :focus-visible {
